<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCVC Library Digital Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .header-banner {
            background-color: #ffffff;
            border-bottom: 3px solid #0d6efd;
        }
        .logo-box {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 4px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header Banner with Logo and Title -->
    <header class="header-banner shadow-sm py-3 mb-4">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <!-- LOGO PLACEHOLDER: Replace the src link below with your Google Drive direct image link -->
                <img id="libraryLogo" src="YOUR_GOOGLE_DRIVE_LOGO_LINK_HERE" alt="Logo" class="logo-box" onerror="this.src=https://lh3.googleusercontent.com/d/1nifGJP16lsyRlGGF8KRauvdFf-uakelN?text=LOGO'">
                <div>
                    <h1 class="h4 mb-0 fw-bold text-dark">ARCVC LIBRARY DIGITAL INTERFACE</h1>
                    <small class="text-muted">College Library Catalog & Status Search</small>
                </div>
            </div>
        </div>
    </header>

    <div class="container py-2">
        <!-- Search Input Bar -->
        <div class="input-group mb-3 shadow-sm">
            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Type title, author, category, or Acc No to search...">
            <button class="btn btn-primary px-4" type="button" onclick="filterBooks()">Search</button>
        </div>

        <!-- Results Info -->
        <p id="resultCount" class="text-muted small mb-3"></p>

        <!-- Catalog Table -->
        <div class="card shadow-sm">
            <div class="card-body p-0 table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Acc No</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" class="text-center py-4">Loading library catalog...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. REPLACE THIS WITH YOUR GOOGLE SHEET PUBLISHED CSV LINK
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqwf3bbbdm6vPMTn9Mojiwzj4vkTNfNxs7js9CxWXCK-ZWSzWjfKY8VeAbaEmuUG6ufYZ0nWb9Y-uC/pub?gid=842449308&single=true&output=csv";

        let allBooks = [];

        window.addEventListener("DOMContentLoaded", () => {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    allBooks = results.data.filter(row => row.Title); // Filter out blank rows
                    displayBooks(allBooks);
                }
            });

            // Live search as user types
            document.getElementById("searchInput").addEventListener("keyup", filterBooks);
        });

        function filterBooks() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allBooks.filter(book => {
                const title = (book.Title || "").toLowerCase();
                const author = (book.Author || "").toLowerCase();
                const category = (book.Category || "").toLowerCase();
                const accNo = (book["Acc no"] || "").toLowerCase();
                
                return title.includes(query) || author.includes(query) || category.includes(query) || accNo.includes(query);
            });
            displayBooks(filtered);
        }

        function displayBooks(books) {
            const tbody = document.getElementById("tableBody");
            document.getElementById("resultCount").innerText = `Showing ${books.length} records found`;
            
            if (books.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No matching books found.</td></tr>`;
                return;
            }

            let html = "";
            books.forEach(book => {
                const statusClass = (book.Status || "").trim().toLowerCase() === "available" ? "bg-success" : "bg-danger";
                html += `
                    <tr>
                        <td>${book["Acc no"] || ""}</td>
                        <td class="fw-bold">${book.Title || ""}</td>
                        <td>${book.Author || ""}</td>
                        <td><span class="badge bg-secondary">${book.Category || ""}</span></td>
                        <td><span class="badge ${statusClass}">${book.Status || "Available"}</span></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
